<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Profile Setup | Somnath Engineering</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-lg bg-white rounded-3xl shadow-2xl overflow-hidden p-8 md:p-10 border border-slate-100">
    <div class="text-center mb-8">
      <span class="bg-blue-50 text-blue-600 text-xs font-bold px-3 py-1.5 rounded-full uppercase tracking-wider">Step 2: Profile Setup</span>
      <h2 class="text-3xl font-extrabold text-slate-900 mt-3">Welcome Aboard!</h2>
      <p class="text-slate-400 text-sm mt-1">Complete your profile setup to access the home dashboard.</p>
    </div>

    <form action="/save-onboarding" method="POST" enctype="multipart/form-data" class="space-y-5">
      
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Upload Profile Image</label>
        <input 
          type="file" 
          name="profileImage" 
          accept="image/*"
          class="w-full border border-slate-200 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 text-sm"
          required 
        />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Gender</label>
          <select name="gender" class="w-full border border-slate-200 p-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 text-slate-800" required>
            <option value="" disabled selected>Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Age</label>
          <input type="number" name="age" min="18" max="100" placeholder="Ex: 25" class="w-full border border-slate-200 p-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 text-slate-800" required />
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Choose Nickname</label>
        <input 
          type="text" 
          name="nickname" 
          placeholder="Ex: Chief_Sam" 
          class="w-full border border-slate-200 p-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 text-slate-800"
          minlength="2"
          required 
        />
      </div>

      <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-4 rounded-xl font-bold shadow-xl transition-all mt-4">
        Save Details & Enter Home 🚀
      </button>
    </form>
  </div>

</body>
</html>
